name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Deliberately not v6: that release moved caching into a separate library that is
      # no longer open source, and dropped configuration-cache support. v5 is the Node 24
      # upgrade on its own, which is all this needs.
      - uses: gradle/actions/setup-gradle@v5

      # Also stages build/providers, which the end-to-end job's image build needs.
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: build/reports/tests/test
          retention-days: 7

  end-to-end:
    name: End-to-end against Keycloak
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Deliberately not v6: that release moved caching into a separate library that is
      # no longer open source, and dropped configuration-cache support. v5 is the Node 24
      # upgrade on its own, which is all this needs.
      - uses: gradle/actions/setup-gradle@v5

      # Brings up the NetHSM + Keycloak stack and drives Keycloak's token, JWKS and
      # admin endpoints. Teardown is a separate step: with -x composeDown the containers
      # survive a failure, so their logs can still be read. Gradle's finalizedBy would
      # otherwise destroy them before the diagnostics step runs, which made every CI
      # failure undiagnosable.
      - run: ./gradlew integrationTest -x composeDown

      - name: Container logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --no-color --tail=400 || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

      # XML, not the HTML report: the HTML tree fails `gh run download` with a path
      # traversal error, and the XML is what carries the assertion messages anyway.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: build/test-results/integrationTest
          retention-days: 7
