name: Release

# Tag a commit `vX.Y.Z` and the JAR file appears at
# https://github.com/Nitrokey/nethsm-keycloak/releases
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the provider JAR file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Not v6, for the reason given in ci.yml.
      - uses: gradle/actions/setup-gradle@v5

      - name: Derive the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # A release is gated on the full suite, not just compilation: the extension builds
      # on Keycloak SPIs marked internal, so "it compiles" says little about whether it
      # still works against the Keycloak version in the compatibility table.
      - name: Build and test
        run: ./gradlew build integrationTest -x composeDown -Pversion=${{ env.VERSION }}

      - name: Container logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --no-color --tail=400 || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

      - name: Checksum
        run: |
          cd build/libs
          sha256sum "nethsm-keycloak-${VERSION}.jar" > "nethsm-keycloak-${VERSION}.jar.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen makes it a semver prerelease (-rc1, -test), which GitHub should
          # label as such rather than presenting alongside stable releases.
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            "build/libs/nethsm-keycloak-${VERSION}.jar" \
            "build/libs/nethsm-keycloak-${VERSION}.jar.sha256"
